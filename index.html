<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <style>
    .text-button{background:none;color:#c9aa73;padding:9px 0 0;font-weight:700;font-size:13px}.inline-delete{background:transparent;color:#ff9b92;font-size:20px;vertical-align:middle;margin-left:8px}.barbell{display:flex;align-items:center;justify-content:center;gap:4px;min-height:58px;margin:4px 0 12px;overflow:hidden}.barbell i{display:block;height:5px;background:#5b5b61;border-radius:4px;flex:1;min-width:10px}.plate{display:grid;place-items:center;width:38px;height:38px;flex:0 0 38px;background:#56565c;color:#fff;border-radius:50%;font-size:10px;font-weight:800;box-shadow:inset 0 0 0 2px #0003}.plate:nth-of-type(3n){background:#56565c;color:#fff}.plate:nth-of-type(4n){background:#56565c}.plate.warm{opacity:.42}.plate small{display:block;font-size:8px}textarea{width:100%;background:#101014;color:#eeeef0;border:1px solid #393940;border-radius:12px;padding:11px;font:inherit;min-height:74px;resize:vertical}.add-button,#saveModal{color:#111115}.metric strong{color:#d8bd8d}.tab-bar{background:#111114ed}.tab.active{color:#d8bd8d}
  </style>
  <title>IronLog</title>
</head>
<body>
  <main class="app-shell">
    <header class="app-header"><div><p class="eyebrow">ALLENAMENTO</p><h1>IRON LOG</h1></div><button id="settingsButton" class="icon-button" aria-label="Impostazioni">⚙</button></header>
    <section id="daysScreen" class="screen active"></section>
    <section id="historyScreen" class="screen"></section>
    <section id="progressScreen" class="screen"></section>
  </main>
  <nav class="tab-bar"><button class="tab active" data-screen="daysScreen">▣<span>Giorni</span></button><button class="tab" data-screen="historyScreen">◫<span>History</span></button><button class="tab" data-screen="progressScreen">↗<span>Analisi</span></button></nav>
  <dialog id="modal"><form id="modalForm" method="dialog"><header><h2 id="modalTitle"></h2><button type="button" id="closeModal" class="icon-button">×</button></header><div id="modalContent"></div><footer><button type="button" id="cancelModal" class="secondary">Annulla</button><button id="saveModal" value="default">Salva</button></footer></form></dialog>
  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
