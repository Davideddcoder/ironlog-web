<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>IronLog</title>
</head>
<body>
  <main class="app-shell">
    <header class="app-header"><div><p class="eyebrow">ALLENAMENTO</p><h1>IRON LOG</h1></div><button id="settingsButton" class="icon-button" aria-label="Impostazioni">⚙</button></header>
    <section id="daysScreen" class="screen active"></section>
    <section id="progressScreen" class="screen"></section>
  </main>
  <nav class="tab-bar"><button class="tab active" data-screen="daysScreen">▣<span>Giorni</span></button><button class="tab" data-screen="progressScreen">↗<span>Progressi</span></button></nav>
  <dialog id="modal"><form id="modalForm" method="dialog"><header><h2 id="modalTitle"></h2><button type="button" id="closeModal" class="icon-button">×</button></header><div id="modalContent"></div><footer><button type="button" id="cancelModal" class="secondary">Annulla</button><button id="saveModal" value="default">Salva</button></footer></form></dialog>
  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
